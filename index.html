<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --red:#ff1a1a; --bg:#000; --fg:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  canvas#rain { position:fixed; inset:0; opacity:.55; }
  .stage {
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.2rem; text-align:center;
  }
  /* الحرف: يُكتب تدريجياً من اليسار لليمين */
  .letter {
    width:min(62vw,340px); height:auto; display:block;
    clip-path: inset(0 100% 0 0);
    animation: write 3.2s steps(60,end) .5s forwards, glitch 4s infinite 4s;
    filter: drop-shadow(0 0 14px rgba(255,255,255,.25));
  }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
  @keyframes glitch {
    0%,92%,100% { transform:none; filter:drop-shadow(0 0 14px rgba(255,255,255,.25)); }
    93% { transform:translate(-4px,1px); filter:drop-shadow(4px 0 var(--red)) drop-shadow(-4px 0 #0ff); }
    95% { transform:translate(4px,-2px); filter:drop-shadow(-4px 0 var(--red)) drop-shadow(4px 0 #0ff); }
    97% { transform:translate(-2px,0); }
  }
  .line {
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(.95rem,3.4vw,1.35rem); color:var(--fg);
    letter-spacing:.08em; min-height:1.6em; direction:ltr;
  }
  .line .num { color:var(--red); text-shadow:0 0 8px var(--red); }
  .cursor {
    display:inline-block; width:.6em; height:1.1em; background:var(--red);
    vertical-align:text-bottom; margin-left:4px; animation:blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }
  .scan {
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
  }
</style>
</head>

<script>
/* ===== خلفية أرقام حمراء تتساقط ===== */
const cv = document.getElementById('rain'), ctx = cv.getContext('2d');
let cols, drops;
function resize(){
  cv.width = innerWidth; cv.height = innerHeight;
  cols = Math.floor(cv.width / 18);
  drops = Array(cols).fill(0).map(()=>Math.random()*-50);
}
resize(); addEventListener('resize', resize);
setInterval(()=>{
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#ff1a1a';
  ctx.font = '16px "Share Tech Mono", monospace';
  drops.forEach((y,i)=>{
    ctx.fillText(Math.random()<.5?'0':'1', i*18, y*18);
    drops[i] = (y*18 > cv.height && Math.random() > .975) ? 0 : y + 1;
  });
}, 60);

/* ===== كتابة الجملة بأسلوب الهاكرز ===== */
const text = 'Welcome to my account';
const line = document.getElementById('line');
const chars = '01#$%&@!?<>/\\|';
const delay = ms => new Promise(r => setTimeout(r, ms));

function render(shown, scramble){
  let html = '';
  for (const c of shown) html += c;
  if (scramble) html += `<span class="num">${scramble}</span>`;
  line.innerHTML = html + '<span class="cursor"></span>';
}

async function type(){
  await delay(3700); // بعد انتهاء كتابة الحرف
  let out = '';
  for (const ch of text){
    // أرقام حمراء عشوائية تتبدل قبل ظهور الحرف الحقيقي
    for (let i=0;i<4;i++){
      render(out, Math.random()<.7 ? String(Math.floor(Math.random()*10)) : chars[Math.floor(Math.random()*chars.length)]);
      await delay(35);
    }
    out += ch;
    render(out, '');
    await delay(60 + Math.random()*70);
  }
}
type();
</script>
